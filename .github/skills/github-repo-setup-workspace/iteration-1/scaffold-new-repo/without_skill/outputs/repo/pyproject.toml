[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packmule"
version = "0.1.0"
description = "A lightweight command-line tool for packing and hauling your files around."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "packmule contributors" },
]
keywords = ["cli", "packaging", "automation", "files"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/your-org/packmule"
Repository = "https://github.com/your-org/packmule"
Issues = "https://github.com/your-org/packmule/issues"
Changelog = "https://github.com/your-org/packmule/blob/main/CHANGELOG.md"

[project.scripts]
packmule = "packmule.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/packmule"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
